<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | escape }}">
  <style id="site-typography">
    :root {
      --writing-mode: {{ site.typography.writing_mode | default: 'horizontal-tb' | escape }};
      --text-orientation: {{ site.typography.text_orientation | default: 'mixed' | escape }};
      --letter-spacing: {{ site.typography.letter_spacing | default: '0em' | escape }};
      --line-height: {{ site.typography.line_height | default: '1.9' | escape }};
      --content-width: {{ site.typography.content_width | default: '760px' | escape }};
    }
  </style>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="site-width site-header-inner">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">首页</a>
        <a href="{{ '/blog/' | relative_url }}">博客</a>
        <a href="{{ '/intro.html' | relative_url }}">个人介绍</a>
      </nav>
    </div>
  </header>
  <main class="site-width site-main">{{ content }}</main>
  <footer class="site-footer site-width">
    <span>{{ site.title }}</span>
    <span>以文字为中心，保持简单。</span>
  </footer>
</body>
</html>
