# 墨客 Jekyll 主题
# 使用方式：将 jekyll-theme/ 下的文件上传到你的博客仓库根目录。
title: 我的博客
description: 以文字为主的个人博客
lang: zh-CN
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

# 页脚中的 GitHub 项目快捷入口；部署到其他仓库时请改成对应地址。
repository_url: https://github.com/zhouseeie/zhouseeie.github.io

typography:
  # 默认版：当前居中留白样式；full：突破容器并占满屏幕宽度
  layout_mode: adaptive
  # horizontal-tb：横排；vertical-rl：从右向左竖排；vertical-lr：从左向右竖排
  writing_mode: horizontal-tb
  text_orientation: mixed
  letter_spacing: 0em
  line_height: 1.9
  content_width: 1440px

# GitHub Discussions comments via giscus.
# Fill repo_id and category_id from https://giscus.app/ before enabling.
comments:
  enabled: false
  provider: giscus
  repo: username/username.github.io
  repo_id: ''
  category: General
  category_id: ''
  mapping: pathname
  strict: '0'
  reactions_enabled: '1'
  emit_metadata: '0'
  input_position: bottom
  theme: light
  lang: zh-CN
  loading: lazy
